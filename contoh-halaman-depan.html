<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lapor Komandan!</title>
<meta name="description" content="Berapa banyak polisi yang terlibat kasus di Indonesia, diperbarui tiap pagi.">
<meta name="color-scheme" content="light">
<style>
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

/* Latar putih dikunci: situs ini sengaja hanya punya satu tampilan. */
:root {
  color-scheme: light;
  --kertas:  #ffffff;
  --tinta:   #000000;
  --tinta-2: #4a4a4a;
  --tinta-3: #8a8a8a;
  --garis:   #000000;
  --pudar:   #e6e6e6;
}

body {
  margin: 0;
  background: var(--kertas);
  color: var(--tinta);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

svg { shape-rendering: crispEdges; }
img, svg { max-width: 100%; }

a { color: var(--tinta); }

/* Judul pixel: lebar mengikuti wadah, tinggi ikut proporsi. */
.judul-pixel { display: block; width: 100%; height: auto; color: var(--tinta); }

body {
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
}

.depan {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: clamp(40px, 7vh, 76px);
  padding: clamp(32px, 6vw, 72px) clamp(20px, 5vw, 64px);
  max-width: 1180px;
  margin: 0 auto;
  width: 100%;
  text-align: center;
}

.kepala { width: min(560px, 78%); }

.baris-baris {
  display: flex;
  flex-direction: column;
  gap: clamp(28px, 5vh, 52px);
  width: 100%;
}

.baris {
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: center;
  gap: 0 .38em;
  line-height: 1.15;
}
.baris .kecil { font-size: clamp(1rem, 2.4vw, 1.6rem); font-weight: 400; }
.baris .angka { font-size: clamp(1.9rem, 5vw, 3.4rem); font-weight: 400; font-variant-numeric: lining-nums; }
.baris .besar { font-size: clamp(2rem, 5.6vw, 3.9rem); font-weight: 400; letter-spacing: -.01em; }

/* Baris kemarin yang kosong: diganti kucing pixel. */
.baris-kucing {
  display: flex;
  justify-content: center;
  width: 100%;
  overflow: hidden;
}
.kucing-panggung {
  position: relative;
  width: min(520px, 90%);
  /* Tinggi panggung disamakan dengan tinggi kucing supaya tidak ada ruang
     kosong menganga di atasnya. */
  height: clamp(54px, 9vw, 72px);
  margin: 0 auto;
  overflow: hidden;
}
/* Lebar kucing dibuat ~separuh panggung, dan geserannya dihitung supaya
   kucing selalu terlihat sebagian: begitu keluar di kanan, sudah masuk lagi
   dari kiri. */
.kucing {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 58%;
  height: auto;
  color: var(--tinta);
  animation: jalan-menyeberang 9s steps(54, end) infinite;
}
/* Geseran dihitung dari lebar kucing sendiri: berangkat dari luar tepi kiri
   dan berhenti tepat setelah tepi kanan, jadi kucing praktis selalu terlihat. */
@keyframes jalan-menyeberang {
  from { transform: translateX(-100%); }
  to   { transform: translateX(172%); }
}
/* Dua frame kaki, digilir supaya terlihat melangkah. Timing linear, karena
   pergantiannya sudah dibuat mendadak lewat keyframes. */
.kucing-frame-a { animation: gilir-a .3s linear infinite; }
.kucing-frame-b { animation: gilir-b .3s linear infinite; }
@keyframes gilir-a { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes gilir-b { 0%, 49.9% { opacity: 0; } 50%, 100% { opacity: 1; } }

.kucing-teks {
  margin: 12px 0 0;
  font-size: clamp(.95rem, 2.2vw, 1.3rem);
  color: var(--tinta);
}
.kucing-teks b { font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  .kucing { animation: none; left: 50%; transform: translateX(-50%); }
  .kucing-frame-b { display: none; }
  .kucing-frame-a { animation: none; }
}

.tautan {
  font-size: clamp(1rem, 2.2vw, 1.35rem);
  text-decoration: none;
  border-bottom: 3px solid var(--tinta);
  padding-bottom: 3px;
}
.tautan:hover { background: var(--tinta); color: var(--kertas); }

.jejak {
  margin: 0;
  padding: 0 20px 22px;
  text-align: center;
  font-size: .75rem;
  color: var(--tinta-3);
}

@media (max-width: 560px) {
  .depan { gap: 34px; justify-content: flex-start; padding-top: 46px; }
  .kepala { width: 88%; }
  .baris { gap: 0 .3em; }
}
</style>
